<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komosion CRM Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Gothic+A1:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D82630; --red-dark:#A81D26; --grey:#1B1B1B; --grey-soft:#767676; --grey-light:#E6E6E6;
  --aqua:#1F8A70; --orange:#CC4B37; --blue:#07305A;
  --bg:#F2F2F2; --surface:#FEFEFE; --text:#0A0A0A; --muted:#5E5E5E; --line:#D9D9D9;
  --ok-bg:#E3F2ED; --warn-bg:#FBE9E5; --bad-bg:#F8E1E1; --sel:#FBEAEB; --info-bg:#E3EBF4;
  --font-head:"Montserrat","Helvetica Neue",Helvetica,Arial,sans-serif; --font-body:"Gothic A1","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E2121; --surface:#2A2E2E; --text:#ECEEEE; --muted:#A9AFAF; --line:#454B4B;
    --ok-bg:#183A30; --warn-bg:#4A2A22; --bad-bg:#4A2020; --sel:#3A2527; --info-bg:#162B44; --blue:#8CC0E8; --bg:#141414; --surface:#1E1E1E; --line:#3A3A3A; --grey:#2B2B2B;
  }
}
:root[data-theme="dark"]{
  --bg:#1E2121; --surface:#2A2E2E; --text:#ECEEEE; --muted:#A9AFAF; --line:#454B4B;
  --ok-bg:#183A30; --warn-bg:#4A2A22; --bad-bg:#4A2020; --sel:#3A2527; --info-bg:#162B44; --blue:#8CC0E8; --bg:#141414; --surface:#1E1E1E; --line:#3A3A3A; --grey:#2B2B2B;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--font-body)}
h1,h2,h3,h4{font-family:var(--font-head);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.topbar{grid-column:1/3;background:#1B1B1B;color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:center;border-bottom:4px solid var(--red)}
.logo{height:26px;width:auto;display:block}
.brandslot{border:1px dashed rgba(255,255,255,.55);border-radius:4px;padding:3px 10px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.topbar h1{font-size:20px;font-weight:600;flex:1}
.topbar input[type=search]{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:6px 10px;width:240px}
.topbar input::placeholder{color:rgba(255,255,255,.75)}
.me{font-size:13px;display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:700;font-size:13px}
.ibtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:5px 9px;cursor:pointer}
.menu{display:none}
nav{background:var(--surface);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
nav .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;text-decoration:none;color:var(--text);font-weight:600;font-size:15px}
nav a:hover{background:var(--bg)}
nav a[aria-current="page"]{background:var(--sel);box-shadow:inset 4px 0 0 var(--red)}
nav .n{margin-left:auto;font-size:12px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px}
main{padding:20px;overflow:auto;max-width:1400px;width:100%}
.sample{background:var(--warn-bg);padding:7px 12px;border-radius:4px;font-size:14px;margin-bottom:16px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h2{font-size:26px;font-weight:600;flex:1}
.ph p{margin:2px 0 0;color:var(--muted);font-size:14px;font-family:var(--font-body);width:100%}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.panel>h3{font-size:17px;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel>h3 .sp{flex:1}
.pb{padding:14px}
.kpi{padding:14px}.kpi .l{font-size:13px;color:var(--muted);font-weight:600}.kpi .v{font-family:var(--font-head);font-size:30px;font-weight:600}
.kpi .d{font-size:13px}.up{color:var(--aqua)}.down{color:var(--red-dark)}
.badge{font-size:12px;border-radius:4px;padding:1px 8px;font-weight:600;white-space:nowrap;display:inline-block}
.b-ok{background:var(--ok-bg);color:var(--aqua)}.b-warn{background:var(--warn-bg);color:#B24E0A}.b-bad{background:var(--bad-bg);color:var(--red-dark)}
.b-grey{background:var(--grey-light);color:#262A2A}.b-info{background:var(--info-bg);color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
.tw{overflow:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select,.in{padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{border:1px solid var(--blue);background:var(--surface);border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--bg)}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.primary:hover{background:var(--red-dark)}
.btn.ok{background:var(--aqua);border-color:var(--aqua);color:#fff}.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:12px;background:var(--grey-light);border-radius:6px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--blue)}
.bar .t i.r{background:var(--red)}
.spark{display:flex;align-items:flex-end;gap:6px;height:120px}.spark div{flex:1;background:var(--blue);border-radius:3px 3px 0 0;position:relative;min-height:4px}
.spark div.cur{background:var(--red)}.spark small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0}.feed li{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px}
.feed .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--grey-soft)}
.feed time{color:var(--muted);font-size:12px;display:block}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow:auto;padding-bottom:8px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:6px;min-height:300px;display:flex;flex-direction:column}
.col h4{font-size:15px;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:600}
.col .cards{padding:8px;display:grid;gap:8px;align-content:start;flex:1}
.col.over{outline:2px dashed var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--grey);border-radius:4px;padding:9px 10px;cursor:grab;font-size:14px}
.card.hot{border-left-color:var(--red)}.card.stale{border-left-color:var(--orange)}
.card b{display:block}.card .m{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;margin-top:3px}
.split{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:16px}
.list{list-style:none;margin:0;padding:0;max-height:72vh;overflow:auto}
.row{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:3px}
.row:hover{background:var(--bg)}.row[aria-selected="true"]{background:var(--sel);box-shadow:inset 4px 0 0 var(--red)}
.row .meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.diff{display:grid;grid-template-columns:130px 1fr 1fr;gap:0;border:1px solid var(--line);border-radius:4px;font-size:14px;overflow:hidden}
.diff>div{padding:7px 10px;border-bottom:1px solid var(--line)}.diff .h{background:var(--bg);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.diff .old{background:var(--bad-bg);text-decoration:line-through;text-decoration-color:rgba(155,0,0,.5)}.diff .new{background:var(--ok-bg)}
.quote{background:var(--bg);border-left:4px solid var(--grey);padding:10px 12px;border-radius:0 4px 4px 0;font-size:15px}
.flag{background:var(--warn-bg);border-radius:4px;padding:8px 12px;font-size:14px}
.stack{display:grid;gap:14px}.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--red)}
.graph{width:100%;height:380px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.graph text{font-size:12px;fill:var(--text)}
.chat{display:grid;grid-template-columns:1fr 340px;gap:16px;height:calc(100vh - 170px);min-height:480px}
.chatbox{display:flex;flex-direction:column;overflow:hidden}.msgs{flex:1;overflow:auto;padding:14px;display:grid;gap:12px;align-content:start}
.msg{max-width:85%;padding:10px 14px;border-radius:8px;font-size:15px}.msg.u{background:var(--blue);color:#fff;justify-self:end}.msg.a{background:var(--bg);border:1px solid var(--line)}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.composer input{flex:1}
.trace{overflow:auto}.tr{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}.tr code{background:var(--bg);padding:0 4px;border-radius:3px}
.sw{position:relative;display:inline-block;width:42px;height:24px}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--grey-light);border-radius:12px;cursor:pointer;transition:.15s}
.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--aqua)}.sw input:checked+span:before{transform:translateX(18px)}
.sw input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);z-index:20;overflow:auto;transform:translateX(105%);transition:transform .18s}
.drawer.open{transform:none}.drawer header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;position:sticky;top:0;background:var(--surface)}
.drawer header h3{flex:1;font-size:19px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--grey);color:#fff;padding:9px 16px;border-radius:6px;z-index:30;font-size:14px;display:none}
.empty{padding:36px;text-align:center;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;font-size:12px;background:var(--bg)}
.sr{position:absolute;left:-9999px}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g21,.g2,.split,.chat{grid-template-columns:1fr}.chat{height:auto}.chatbox{height:60vh}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}.topbar{grid-column:1}.menu{display:inline-block}
  nav{display:none;position:fixed;top:56px;left:0;bottom:0;width:240px;z-index:15;box-shadow:8px 0 24px rgba(0,0,0,.2)}nav.open{display:block}
  .topbar input[type=search]{display:none}.me span{display:none}main{padding:16px}.g4{grid-template-columns:1fr 1fr}
  .diff{grid-template-columns:90px 1fr 1fr}
}
</style>
</head>

let selM="m1";
VIEWS.review=()=>header("Review queue","Each meeting produces a change plan. Approve, edit, redo or reject before anything is written. <kbd>A</kbd> approve · <kbd>R</kbd> reject · <kbd>J</kbd>/<kbd>K</kbd> next/previous",
 `<span class="badge b-warn">${pendingCount()} pending</span>`)+`
 <div class="toolbar" id="rf">${["all","pending","approved","rejected"].map(s=>`<button class="chip" aria-pressed="${s==="pending"}" data-f="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join("")}</div>
 <div class="split"><div class="panel"><ul class="list" id="rl" role="listbox" aria-label="Meetings"></ul></div><div class="panel" id="rd"></div></div>`;
VIEWS.review_init=()=>{
  let f="pending";
  const vis=()=>MEETINGS.filter(m=>f==="all"||m.state===f);
  const draw=()=>{
    const v=vis();if(!v.find(m=>m.id===selM)&&v.length)selM=v[0].id;
    $("#rl").innerHTML=v.map(m=>`<li class="row" role="option" tabindex="0" data-id="${m.id}" aria-selected="${m.id===selM}"><b>${esc(m.title)}</b><div class="meta"><span>${m.date}</span><span class="badge ${stBadge(m.state)}">${m.state}</span></div></li>`).join("")||`<li class="empty">Nothing here.</li>`;
    $$("#rl .row").forEach(r=>{r.onclick=()=>{selM=r.dataset.id;draw()};r.onkeydown=e=>{if(e.key==="Enter")r.click()}});
    const m=MEETINGS.find(x=>x.id===selM);
    if(!m){$("#rd").innerHTML=`<div class="empty">Queue is clear.</div>`;buildNav();return}
    $("#rd").innerHTML=`<div class="pb stack">
     <div class="row2"><h3 style="flex:1">${esc(m.title)}</h3><span class="badge ${stBadge(m.state)}">${m.state}</span></div>
     <div class="hint">Skill used: <code>${m.skill}</code> · Confidence ${Math.round(m.conf*100)}%</div>
     <div class="quote">${esc(m.quote)}</div>
     ${m.flag?`<div class="flag">${esc(m.flag)}</div>`:""}
     <div class="diff"><div class="h">Field</div><div class="h">Now in Pipedrive</div><div class="h">Proposed</div>
       ${m.changes.map(c=>`<div><b>${c[0]}</b></div><div class="old">${esc(c[1])}</div><div class="new"><input class="in" style="width:100%;background:transparent;border:0;padding:0" value="${esc(c[2])}" aria-label="Proposed ${c[0]}" ${m.state!=="pending"?"disabled":""}></div>`).join("")}</div>
     ${m.state==="pending"?`<div class="row2"><button class="btn ok" data-a="approved">Approve</button><button class="btn" data-a="redo">Redo with note</button><button class="btn primary" data-a="rejected">Reject</button>
       <input class="in" id="why" placeholder="Reason (needed to reject or redo)" style="flex:1;min-width:180px" aria-label="Reason"></div>
       <div class="hint">Approving records a change plan for a person to apply. The app has no write access to Pipedrive.</div>`:`<div class="hint">Decision recorded by Yethu.</div>`}
    </div>`;
    $$("#rd [data-a]").forEach(b=>b.onclick=()=>decide(b.dataset.a));
    buildNav();
  };
  const decide=a=>{const m=MEETINGS.find(x=>x.id===selM);if(!m||m.state!=="pending")return;
    if(a!=="approved"&&!$("#why").value.trim()){$("#why").focus();toast("Add a reason first");return}
    m.state=a==="redo"?"pending":a;if(a==="redo"){m.flag="Redo requested: "+$("#why").value;toast("Sent back to the model with your note")}else toast(a==="approved"?"Approved: change plan saved":"Rejected");
    const v=vis();if(f==="pending"&&a!=="redo"){const n=v.find(x=>x.id!==m.id);if(n)selM=n.id}draw()};
  $$("#rf .chip").forEach(c=>c.onclick=()=>{f=c.dataset.f;$$("#rf .chip").forEach(x=>x.setAttribute("aria-pressed",x===c));draw()});
  VIEWS._key=e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const v=vis(),i=v.findIndex(x=>x.id===selM);
    if(e.key==="a")decide("approved");else if(e.key==="r"){const w=$("#why");if(w){w.focus();e.preventDefault()}}
    else if(e.key==="j"&&v[i+1]){selM=v[i+1].id;draw()}else if(e.key==="k"&&v[i-1]){selM=v[i-1].id;draw()}};
  draw();
};

async function load(){
  try{const [c,r]=await Promise.all([fetch("api/config"),fetch("api/runs")]);
    if(!c.ok||!r.ok)throw 0;LIVE.cfg=await c.json();LIVE.runs=await r.json();LIVE.ok=true}catch(e){LIVE.ok=false}
}
const when=t=>new Date(t*1000).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

/* ---------- skills ---------- */
VIEWS.skills=()=>{
  const list=LIVE.ok?LIVE.cfg.skills.map(s=>[s.name,s.description,s.always_loaded]):SKILLS.map(s=>[s[0],s[1],s[2]==="locked"]);
  const used={};LIVE.runs.forEach(r=>r.skills_loaded.forEach(n=>used[n]=(used[n]||0)+1));
  return header("Skills","The Komosion skill set the assistant can load. Source: crm-skillsets. Read-only here; change skills upstream.")+`
  <div class="grid g3">${list.map(s=>`<div class="panel"><div class="pb stack"><div class="row2"><h4 style="flex:1">${esc(s[0])}</h4>${s[2]?'<span class="badge b-info">always on</span>':'<span class="badge b-grey">on demand</span>'}</div><div style="font-size:14px">${esc(s[1])}</div><div class="hint">${LIVE.ok?`Loaded in ${used[s[0]]||0} of your runs`:""}</div></div></div>`).join("")}</div>`;
};

/* ---------- run log ---------- */
VIEWS.runs=()=>{
  const R=LIVE.runs,cost=R.reduce((a,r)=>a+(r.cost_usd||0),0),avg=R.length?R.reduce((a,r)=>a+(r.latency_ms||0),0)/R.length/1000:0,err=R.filter(r=>r.error).length;
  return header("Run log","Every answer, with tokens, cost and time. Yours only.",`<a class="btn" href="api/runs.csv">Download CSV</a>`)+`
  <div class="grid g4" style="margin-bottom:16px"><div class="panel kpi"><div class="l">Runs</div><div class="v">${R.length}</div></div><div class="panel kpi"><div class="l">Cost</div><div class="v">$${cost.toFixed(3)}</div></div><div class="panel kpi"><div class="l">Avg time</div><div class="v">${avg.toFixed(1)}s</div></div><div class="panel kpi"><div class="l">Errors</div><div class="v">${err}</div></div></div>
  <div class="panel tw"><table><thead><tr><th>Time</th><th>Question</th><th>Model</th><th>Skills</th><th>Calls</th><th>Tokens in/out</th><th>Cost</th><th>Time</th><th>Result</th></tr></thead><tbody>${R.map(r=>`<tr><td>${when(r.created_at)}</td><td>${esc(r.question)}</td><td>${esc(r.model||"")}</td><td>${r.skills_loaded.length}</td><td>${r.tool_calls}</td><td>${r.prompt_tokens??"-"} / ${r.completion_tokens??"-"}</td><td>${r.cost_usd!=null?"$"+r.cost_usd.toFixed(4):"-"}</td><td>${r.latency_ms!=null?(r.latency_ms/1000).toFixed(1)+"s":"-"}</td><td><span class="badge ${r.error?"b-bad":"b-ok"}">${r.error?"error":"ok"}</span></td></tr>`).join("")||`<tr><td colspan="9" class="empty">No runs yet. Ask a question in the chat.</td></tr>`}</tbody></table></div>`;
};

/* ---------- connections ---------- */
VIEWS.connections=()=>{
  const c=LIVE.cfg||{pipedrive:{},google:{}},p=c.pipedrive||{},g=c.google||{};
  const cards=[
   ["Pipedrive",p.connected?`Connected${p.account?" as "+esc(p.account):""} · read-only (${esc(p.kind||"oauth")})`:p.available?"Not connected. Connect it in the chat sidebar.":"Not configured on the server.",p.connected?"ok":"warn"],
   ["Google (Gmail, Drive, Calendar)",g.connected?`Connected${g.account?" as "+esc(g.account):""} · read-only`:g.available?"Available but not connected.":"Off. Email and document content would be sent to DeepSeek's API, so the team must agree first.",g.connected?"ok":"warn"],
   ["DeepSeek API",c.deepseek_configured?"Key set on the server.":"No key set.",c.deepseek_configured?"ok":"bad"]];
  return header("Connections","Each person connects their own accounts. Tokens are stored encrypted.",`<a class="btn primary" href="./">Manage in chat</a>`)+`
  <div class="grid g3">${cards.map(k=>`<div class="panel"><div class="pb stack"><div class="row2"><h3 style="flex:1">${k[0]}</h3><span class="badge b-${k[2]}">${k[2]==="ok"?"Connected":"Off"}</span></div><div style="font-size:14px">${k[1]}</div></div></div>`).join("")}</div>
  <div class="panel" style="margin-top:16px"><h3>Safety</h3><div class="pb stack"><div class="row2"><span class="badge b-ok">Read-only</span>Only read tools are offered; any other call is refused before it reaches Pipedrive.</div><div class="row2"><span class="badge b-ok">Per user</span>Chats and runs are scoped to your sign-in.</div><div class="row2"><span class="badge b-ok">No admin scopes</span>Admin, mail and mail-sending are never requested.</div></div></div>`;
};

/* ---------- settings ---------- */
VIEWS.settings=()=>header("Settings","Defaults for review, models and the team.")+`
 <div class="grid g2"><div class="panel"><h3>Review</h3><div class="pb stack">
  <label>Auto-flag below confidence <input class="in" type="number" value="70" min="0" max="100" style="width:80px"> %</label>
  <label class="row2"><span class="sw"><input type="checkbox" checked><span></span></span> Require a reason to reject</label>
  <label class="row2"><span class="sw"><input type="checkbox" checked><span></span></span> Show spoken-only numbers as unconfirmed</label></div></div>
 <div class="panel"><h3>Models and cost</h3><div class="pb stack">
  <label>Default model <select class="in"><option>deepseek-flash</option><option>deepseek-v4-pro</option></select></label>
  <label>Daily cost alert <input class="in" type="number" value="5" style="width:80px"> USD</label></div></div>
 <div class="panel"><h3>Team</h3><div class="tw"><table><thead><tr><th>Person</th><th>Role</th><th>Pipedrive</th></tr></thead><tbody>${PEOPLE.map((p,i)=>`<tr><td>${p}</td><td>${["Lead","Director","Builder","Builder","Builder"][i]}</td><td><span class="badge ${i<4?"b-ok":"b-warn"}">${i<4?"connected":"not yet"}</span></td></tr>`).join("")}</tbody></table></div></div>
 <div class="panel"><h3>Data</h3><div class="pb stack"><div class="hint">Run log retention</div><select class="in"><option>90 days</option><option>1 year</option></select><button class="btn" onclick="toast('Not in the prototype')">Export all my chats</button></div></div></div>`;

load().then(render);
</script>
</body>
</html>
